<main>
  <div class="greenSpaceDetail">
    <h1 class="greenSpaceDetail__title">{{ space.nom }}</h1>
    <img
      [src]="space.imageSpaceUrl"
      alt="Image de {{ space.nom }}"
      class="greenSpaceDetail__img"
    />
  </div>
  <section class="container">
    <div class="greenSpaceDetail__info">
      <p>{{ space.superficie }} Hectares</p>
      <p>{{ space.responsable }}</p>
      <p>Latitude : {{ space.latitude }}</p>
      <p>Longitude : {{ space.longitude }}</p>
      <div class="greenSpaceDetail__plantes">
        <h2>Plantes</h2>
        @for(plante of plantes; track plante._id){
          <app-card-plante [plante]="plantes"></app-card-plante>
          }
      </div>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <label>
        Nom :
        <input type="text" formControlName="nom" />
      </label>
      <label>
        Emplacement :
        <input
          type="number"
          formControlName="latitude"
          placeholder="Latitude"
        />
        <input
          type="number"
          formControlName="longitude"
          placeholder="Longitude"
        />
      </label>
      <label>
        Superficie :
        <input type="number" formControlName="superficie" />
      </label>
      <label>
        Responsable :
        <input type="text" formControlName="responsable" />
      </label>
      <label>
        Image :
        <input type="file" accept="image/*" (change)="onFileSelected($event)" />
      </label>
      <button type="submit">Envoyer</button>
    </form>
    <button (click) ="viewForm = !viewForm">Ajouter une plante</button>
    <app-plantes-form *ngIf="viewForm"></app-plantes-form>
    <button (click)="deleteSpace(space._id)">Supprimer l'espace vert</button>
  </section>
</main>

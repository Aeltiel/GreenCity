<a class="greenSpaceCard" [routerLink]="['/space', space()._id]">
  <div class="greenSpaceCard__title">
    <h3>{{ space().nom }}</h3>
    <img [src]="space().imageSpaceUrl" alt="Image de {{ space().nom }}" class="greenSpaceCard__img" />
    <p>{{ space().superficie }} Hectares</p>
  </div>
  <p class="greenSpaceCard__text">{{ space().responsable }}</p>
</a>

<a class="greenSpaceCard" [routerLink]="['/space', space()._id]">
  <div class="greenSpaceCard__title">
    <h3>{{ space().nom }}</h3>
  </div>
  <img [src]="space().imageSpaceUrl" alt="Image de {{ space().nom }}" class="greenSpaceCard__img" />
  <div class="greenSpaceCard__text">
    <p>Superficie : {{ space().superficie }} Hectares</p>
    <p>Plantes : {{space().plantes}}</p>
    <p class="greenSpaceCard__text__responsable">{{ space().responsable }}</p>
  </div>

</a>
